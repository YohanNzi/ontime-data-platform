[project]
name = "ontime-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YohanNzi", email = "yohannzi.pro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dlt>=1.30.0",
    "duckdb>=1.5.5",
]

[project.scripts]
ontime-data-platform = "ontime_data_platform:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
